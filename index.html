<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111">
<title>Змійка</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Змійка</h1>

<div class="controls">
    Керування: ↑ ↓ ← →
</div>

<div class="center">
    <div class="wrapper">
        <canvas id="game"></canvas>
        <div class="overlay" id="overlay">
            <div class="menu">
                <h2 id="gameText">Змійка</h2>
                <button type="button" id="startBtn">Старт</button>
            </div>
        </div>
    </div>
</div>

<div class="panel">
    <div id="score">Рахунок: 0</div>
    <div id="highscore">Рекорд: 0</div>
</div>

<script src="game.js"></script>

</body>
</html>
